<head>

  <title>문의 | 오늘 저녁 뭐 먹지?</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap");

    :root{
      --ink:#161616;
      --muted:#5b5b66;
      --card:#ffffff;
      --border: rgba(15,15,20,.08);
      --shadow: 0 24px 50px rgba(15,15,20,.14);
      --accent:#ff6a3d;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 700px at 15% 10%, rgba(255,106,61,.18), transparent 60%),
        radial-gradient(700px 600px at 85% 15%, rgba(0,184,169,.12), transparent 60%),
        linear-gradient(120deg, #f6efe5 0%, #e8f7f2 55%, #fff0f4 100%);
      padding:32px;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      display:grid;
      gap:16px;
    }

    header{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    h1{
      margin:0;
      font-family:"Source Serif 4", serif;
      font-size:32px;
      letter-spacing:-.3px;
    }

    .top-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      font-weight:700;
      font-size:14px;
    }
    .top-nav a{
      text-decoration:none;
      color:var(--ink);
      background: rgba(255,255,255,.9);
      border:1px solid var(--border);
      padding:8px 12px;
      border-radius:999px;
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
    }

    .card{
      background: var(--card);
      border-radius:20px;
      padding:20px 22px;
      box-shadow: var(--shadow);
      border:1px solid var(--border);
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      font-size:14px;
    }

    input, textarea{
      width:100%;
      border:1px solid rgba(15,15,20,.12);
      border-radius:12px;
      padding:12px 14px;
      font-size:14px;
      font-family:"Noto Sans KR", sans-serif;
      background:#ffffff;
      outline:none;
      transition: border .12s ease, box-shadow .12s ease;
    }

    input:focus, textarea:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,106,61,.25);
    }

    textarea{ min-height:140px; resize:vertical; }

    .row{
      display:grid;
      gap:12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (max-width: 640px){
      .row{ grid-template-columns: 1fr; }
    }

    .submit{
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
      background: linear-gradient(135deg, #ffbe7b, #ff6a3d);
      color:#111827;
      box-shadow: 0 10px 20px rgba(255,106,61,.2);
      transition: transform .12s ease, filter .12s ease;
    }
    .submit:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .submit:active{ transform: translateY(1px) scale(.99); }

    p{ margin:0 0 12px; color:var(--muted); line-height:1.7; }
  </style>

</head>
<body>
  <main class="wrap">
    <header>
      <h1>문의</h1>
      <nav class="top-nav" aria-label="주요 메뉴">
        <a href="index.html">홈</a>
        <a href="guide.html">저녁 가이드</a>
        <a href="about.html">소개</a>
        <a href="privacy.html">개인정보처리방침</a>
        <a href="terms.html">이용약관</a>
      </nav>
    </header>

    <section class="card">
      <p>제휴/피드백/오류 제보는 아래 폼으로 보내주세요. 빠르게 확인하고 답변드리겠습니다.</p>
      <form action="https://formspree.io/f/xbdoqkdp" method="POST">
        <div class="row">
          <div>
            <label for="name">담당자 이름</label>
            <input id="name" name="name" type="text" placeholder="홍길동" required />
          </div>
          <div>
            <label for="company">회사명</label>
            <input id="company" name="company" type="text" placeholder="OOO" />
          </div>
        </div>
        <div class="row">
          <div>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="email@company.com" required />
          </div>
          <div>
            <label for="topic">문의 유형</label>
            <input id="topic" name="topic" type="text" placeholder="제휴 / 오류 / 제안" />
          </div>
        </div>
        <div>
          <label for="message">문의 내용</label>
          <textarea id="message" name="message" placeholder="상세 내용을 적어 주세요." required></textarea>
        </div>
        <button class="submit" type="submit">문의 보내기</button>
      </form>
    </section>
  </main>
</body>
</html>
