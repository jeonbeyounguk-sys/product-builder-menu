<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="google-adsense-account" content="ca-pub-8103898176582931" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8103898176582931"
     crossorigin="anonymous"></script>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘 저녁 뭐 먹지?</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap");

    :root{
      --ink:#161616;
      --muted:#5b5b66;
      --card:#ffffff;
      --accent:#ff6a3d;
      --accent-2:#00b8a9;
      --accent-3:#ffd166;
      --shadow: 0 28px 60px rgba(15,15,20,.18);
      --border: rgba(15,15,20,.08);
      --bg-1:#f6efe5;
      --bg-2:#e8f7f2;
      --bg-3:#fff0f4;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 700px at 15% 10%, rgba(255,106,61,.22), transparent 60%),
        radial-gradient(700px 600px at 85% 15%, rgba(0,184,169,.18), transparent 60%),
        radial-gradient(800px 700px at 20% 85%, rgba(255,209,102,.25), transparent 60%),
        linear-gradient(120deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      padding:32px;
    }

    .wrap{
      max-width: 1140px;
      margin: 0 auto;
      display:grid;
      gap:18px;
    }

    header{
      display:flex;
      flex-wrap:wrap;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo-badge{
      width:56px;
      height:56px;
      border-radius:16px;
      background: linear-gradient(135deg, #111827, #1f2937);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-family:"Anton", sans-serif;
      font-size:22px;
      letter-spacing:.5px;
      box-shadow: 0 16px 30px rgba(17,24,39,.25);
    }

    h1{
      margin:0;
      font-family:"Source Serif 4", serif;
      font-size:34px;
      letter-spacing:-.4px;
    }

    .sub{
      color:var(--muted);
      font-weight:700;
    }

    .layout{
      display:grid;
      gap:20px;
      grid-template-columns: 1.1fr .9fr;
      align-items:start;
    }

    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }

    .card{
      background: var(--card);
      border-radius:24px;
      padding:22px 24px;
      box-shadow: var(--shadow);
      border:1px solid var(--border);
      position:relative;
      overflow:hidden;
    }

    .hero{
      background: linear-gradient(135deg, #111827, #0f172a);
      color:#fff;
      border: none;
    }

    .hero h2{
      margin:0 0 8px;
      font-family:"Source Serif 4", serif;
      font-size:26px;
    }

    .hero p{ margin:0; color: rgba(255,255,255,.85); }

    .filters{
      margin-top:16px;
      display:grid;
      gap:12px;
    }

    .row{
      display:grid;
      gap:12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (max-width: 640px){
      .row{ grid-template-columns: 1fr; }
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      font-size:14px;
    }

    select, input[type="range"]{
      width:100%;
      border:0;
      outline:none;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight:700;
      background: rgba(255,255,255,.95);
      cursor:pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
    }

    .range-wrap{
      background: rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 12px;
      display:grid;
      gap:6px;
    }

    .range-meta{
      display:flex;
      justify-content:space-between;
      color: rgba(255,255,255,.8);
      font-size:12px;
      font-weight:700;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:10px;
    }

    .btn{
      border: 0;
      cursor:pointer;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 900;
      color:#0b1020;
      background: linear-gradient(135deg, #ffd166, #ff8c5a, #00c2a8);
      box-shadow: 0 12px 26px rgba(255, 140, 90, .25);
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active{ transform: translateY(1px) scale(.99); }

    .btn-ghost{
      background: rgba(255,255,255,.9);
      color:#0b1020;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
    }

    .result-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:14px;
      margin-top:12px;
    }

    @media (max-width: 760px){
      .result-grid{ grid-template-columns: 1fr; }
    }

    .meal-card{
      border-radius:18px;
      padding:16px;
      background: rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.6);
      box-shadow: 0 12px 26px rgba(0,0,0,.1);
      position:relative;
      overflow:hidden;
      animation: rise .4s ease both;
    }

    .meal-card::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(255,106,61,.18), rgba(0,184,169,.14), rgba(255,209,102,.18));
      opacity:.85;
      pointer-events:none;
    }

    .meal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      position: relative;
      z-index: 1;
    }

    .meal-title{
      font-weight:900;
      letter-spacing:-.2px;
    }

    .tag{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      color:#111827;
      background: rgba(255,255,255,.9);
      font-weight:800;
      box-shadow: 0 8px 16px rgba(0,0,0,.08);
    }

    .meal-desc{
      margin:8px 0 12px;
      color: rgba(11, 16, 32, .75);
      font-size:13px;
      font-weight:600;
      position: relative;
      z-index: 1;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      position: relative;
      z-index: 1;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background: rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.6);
    }

    .side-card h3{
      margin:0 0 10px;
      font-family:"Source Serif 4", serif;
      font-size:22px;
      letter-spacing:-.3px;
    }

    .side-card p{
      margin:0 0 12px;
      color:var(--muted);
    }

    .suggestions{
      display:grid;
      gap:10px;
    }

    .quick{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid var(--border);
      cursor:pointer;
      font-weight:700;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .quick:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(17,24,39,.12);
    }

    .note{
      font-size:12px;
      color:var(--muted);
      margin:12px 0 0;
    }

    .meta{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,.7);
      font-weight: 700;
    }

    .form-box{
      margin-top:16px;
      padding:16px;
      border-radius:18px;
      background:#fff7ee;
      border:1px solid rgba(255,106,61,.18);
      box-shadow: 0 10px 22px rgba(255,106,61,.12);
    }

    .form-box h4{
      margin:0 0 8px;
      font-size:16px;
      letter-spacing:-.2px;
    }

    .form-grid{
      display:grid;
      gap:10px;
    }

    .form-grid label{
      margin-bottom:4px;
      font-size:12px;
    }

    .form-grid input,
    .form-grid textarea{
      width:100%;
      border:1px solid rgba(15,15,20,.12);
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
      font-family:"Noto Sans KR", sans-serif;
      background:#ffffff;
      outline:none;
      transition: border .12s ease, box-shadow .12s ease;
    }

    .form-grid input:focus,
    .form-grid textarea:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,106,61,.25);
    }

    .form-grid textarea{
      min-height:110px;
      resize:vertical;
    }

    .submit{
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
      background: linear-gradient(135deg, #ffbe7b, #ff6a3d);
      color:#111827;
      box-shadow: 0 10px 20px rgba(255,106,61,.2);
      transition: transform .12s ease, filter .12s ease;
    }
    .submit:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .submit:active{ transform: translateY(1px) scale(.99); }

    @keyframes rise{
      from{ transform: translateY(8px); opacity:0; }
      to{ transform: translateY(0); opacity:1; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">
        <div class="logo-badge">DIN</div>
        <div>
          <h1>오늘 저녁 뭐 먹지?</h1>
          <div class="sub">기분, 예산, 시간에 맞춰 저녁 메뉴를 딱 골라드려요.</div>
        </div>
      </div>
      <div class="sub">추천 기준: 기분 · 예산 · 준비 시간 · 매운맛</div>
    </header>

    <section class="layout">
      <div class="card hero">
        <h2>저녁 추천 메이커</h2>
        <p>슬라이더와 선택지를 바꾸고 버튼을 눌러 오늘의 저녁을 받아보세요.</p>

        <div class="filters">
          <div class="row">
            <div>
              <label for="mood">오늘 분위기</label>
              <select id="mood">
                <option value="comfort" selected>따뜻한 위로</option>
                <option value="fresh">상큼한 리셋</option>
                <option value="party">친구들과 신나게</option>
                <option value="diet">가볍게</option>
                <option value="late">야식 느낌</option>
              </select>
            </div>
            <div>
              <label for="style">선호 스타일</label>
              <select id="style">
                <option value="any" selected>상관없음</option>
                <option value="korean">한식</option>
                <option value="asian">아시안</option>
                <option value="western">양식</option>
                <option value="fast">간편식</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="budget">예산</label>
              <select id="budget">
                <option value="low">1만원 이하</option>
                <option value="mid" selected>1~2만원</option>
                <option value="high">2만원 이상</option>
              </select>
            </div>
            <div>
              <label for="time">준비 시간</label>
              <select id="time">
                <option value="quick">15분 내</option>
                <option value="mid" selected>30분 내</option>
                <option value="long">60분 이상</option>
              </select>
            </div>
          </div>

          <div class="range-wrap">
            <label for="spice">매운맛 강도</label>
            <input id="spice" type="range" min="0" max="4" step="1" value="2" />
            <div class="range-meta">
              <span>순한맛</span>
              <span id="spiceLabel">보통</span>
              <span>매운맛</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="pick" class="btn">오늘 저녁 추천받기</button>
          <button id="shuffle" class="btn btn-ghost" type="button">다른 조합 보기</button>
        </div>

        <div id="results" class="result-grid" aria-live="polite"></div>
        <div class="meta">업데이트 시간: <span id="timeStamp">-</span></div>
      </div>

      <div class="card side-card">
        <h3>빠른 선택</h3>
        <p>버튼을 눌러 추천 기준을 자동 세팅하세요.</p>

        <div class="suggestions">
          <button class="quick" data-preset="work">퇴근 후 빠르게</button>
          <button class="quick" data-preset="date">데이트 무드</button>
          <button class="quick" data-preset="rain">비 오는 날</button>
          <button class="quick" data-preset="diet">가볍게 먹기</button>
        </div>

        <div class="form-box">
          <h4>제휴 문의</h4>
          <form class="form-grid" action="https://formspree.io/f/xbdoqkdp" method="POST">
            <div>
              <label for="name">담당자 이름</label>
              <input id="name" name="name" type="text" placeholder="홍길동" required />
            </div>
            <div>
              <label for="company">회사명</label>
              <input id="company" name="company" type="text" placeholder="OOO" required />
            </div>
            <div>
              <label for="email">이메일</label>
              <input id="email" name="email" type="email" placeholder="email@company.com" required />
            </div>
            <div>
              <label for="message">문의 내용</label>
              <textarea id="message" name="message" placeholder="제휴 목적, 일정, 기대 효과 등을 적어 주세요." required></textarea>
            </div>
            <button class="submit" type="submit">제휴 문의 제출</button>
          </form>
        </div>

        <p class="note">* 모든 추천은 취향 기반 아이디어입니다. 알레르기/기호는 꼭 체크해주세요.</p>
      </div>
    </section>

    <section class="card" style="margin-top:20px;">
      <h3 style="margin:0 0 10px; font-family:'Source Serif 4', serif;">댓글</h3>
      <div id="disqus_thread"></div>
      <script>
          var disqus_config = function () {
          this.page.url = window.location.href;
          this.page.identifier = window.location.pathname || "dinner-menu";
          };
          (function() { // DON'T EDIT BELOW THIS LINE
          var d = document, s = d.createElement('script');
          s.src = 'https://wjsurapsb.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
          })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </section>
  </main>

  <script>
    const data = [
      { name:"불고기 덮밥", style:"korean", mood:["comfort","work"], time:"quick", budget:"mid", spice:1, desc:"달큰한 불고기에 반숙 계란으로 든든하게.", tags:["달큰함","한그릇","집밥"] },
      { name:"김치볶음밥", style:"korean", mood:["late","work"], time:"quick", budget:"low", spice:2, desc:"냉장고 재료로 10분 완성, 치즈 얹어도 좋아요.", tags:["초간단","야식","한그릇"] },
      { name:"닭갈비", style:"korean", mood:["party","comfort"], time:"mid", budget:"mid", spice:3, desc:"채소와 닭을 매콤하게 볶아 같이 먹는 메뉴.", tags:["매콤","함께","포만감"] },
      { name:"순두부찌개", style:"korean", mood:["comfort","rain"], time:"mid", budget:"low", spice:2, desc:"부드러운 순두부에 칼칼한 국물.", tags:["국물","따뜻함","집밥"] },
      { name:"미소 라멘", style:"asian", mood:["comfort","rain"], time:"mid", budget:"mid", spice:1, desc:"따뜻한 국물과 차슈로 위로되는 한 그릇.", tags:["국물","일식","따뜻함"] },
      { name:"마라탕", style:"asian", mood:["party","late"], time:"mid", budget:"high", spice:4, desc:"얼얼한 마라로 스트레스 날리기.", tags:["강렬","매운맛","중식"] },
      { name:"쌀국수", style:"asian", mood:["fresh","diet"], time:"mid", budget:"mid", spice:0, desc:"향긋한 허브와 담백한 국물.", tags:["가벼움","국물","베트남"] },
      { name:"연어 포케", style:"western", mood:["fresh","diet","date"], time:"quick", budget:"high", spice:0, desc:"차갑고 상큼하게, 단백질 충전.", tags:["가벼움","샐러드","단백질"] },
      { name:"스테이크 샐러드", style:"western", mood:["date","fresh"], time:"mid", budget:"high", spice:0, desc:"큼직한 스테이크와 샐러드로 분위기 업.", tags:["데이트","고단백","샐러드"] },
      { name:"크림 파스타", style:"western", mood:["comfort","date"], time:"mid", budget:"mid", spice:0, desc:"부드러운 크림과 버섯으로 포근함.", tags:["부드러움","양식","포만감"] },
      { name:"토마토 파스타", style:"western", mood:["fresh","work"], time:"mid", budget:"mid", spice:1, desc:"상큼한 토마토 베이스로 기분 리셋.", tags:["상큼함","양식","한그릇"] },
      { name:"치킨 & 감자", style:"fast", mood:["party","late"], time:"quick", budget:"mid", spice:1, desc:"바삭한 치킨으로 소소한 파티.", tags:["바삭함","친구","배달"] },
      { name:"샌드위치 플래터", style:"fast", mood:["fresh","work"], time:"quick", budget:"mid", spice:0, desc:"재료만 준비하면 끝나는 간편식.", tags:["간단","가벼움","브런치"] },
      { name:"타코", style:"asian", mood:["party","fresh"], time:"mid", budget:"mid", spice:2, desc:"바삭한 토르티야에 재료 가득.", tags:["캐주얼","함께","멕시칸"] },
      { name:"된장찌개+삼겹", style:"korean", mood:["comfort","party"], time:"long", budget:"high", spice:1, desc:"쌈 싸서 먹는 한국식 저녁 정석.", tags:["든든","고기","집밥"] },
      { name:"비빔국수", style:"korean", mood:["fresh","late"], time:"quick", budget:"low", spice:3, desc:"시원하고 새콤하게 매운맛.", tags:["새콤","매콤","여름"] }
    ];

    const moodEl = document.getElementById("mood");
    const styleEl = document.getElementById("style");
    const budgetEl = document.getElementById("budget");
    const timeEl = document.getElementById("time");
    const spiceEl = document.getElementById("spice");
    const spiceLabel = document.getElementById("spiceLabel");
    const resultsEl = document.getElementById("results");
    const stampEl = document.getElementById("timeStamp");

    const spiceNames = ["순함", "살짝", "보통", "매콤", "강렬"];

    function nowKST(){
      return new Intl.DateTimeFormat("ko-KR",{
        timeZone:"Asia/Seoul",
        dateStyle:"medium",
        timeStyle:"short"
      }).format(new Date());
    }

    function pickMeal(){
      const mood = moodEl.value;
      const style = styleEl.value;
      const budget = budgetEl.value;
      const time = timeEl.value;
      const spice = parseInt(spiceEl.value, 10);

      let list = data.filter(item => item.mood.includes(mood) || item.mood.includes("work") && mood === "comfort");
      if (style !== "any") list = list.filter(item => item.style === style);
      list = list.filter(item => item.budget === budget || budget === "mid");
      list = list.filter(item => item.time === time || time === "mid");
      list = list.filter(item => Math.abs(item.spice - spice) <= 1);

      if (list.length < 4){
        list = data.filter(item => Math.abs(item.spice - spice) <= 2);
      }

      return shuffle(list).slice(0, 4);
    }

    function shuffle(arr){
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function render(){
      const meals = pickMeal();
      resultsEl.innerHTML = "";
      meals.forEach((meal, idx) => {
        const card = document.createElement("div");
        card.className = "meal-card";
        card.style.animationDelay = `${idx * 0.05}s`;
        card.innerHTML = `
          <div class="meal-head">
            <div class="meal-title">${meal.name}</div>
            <span class="tag">추천</span>
          </div>
          <div class="meal-desc">${meal.desc}</div>
          <div class="pill-row">
            <span class="pill">예산: ${budgetText(meal.budget)}</span>
            <span class="pill">시간: ${timeText(meal.time)}</span>
            <span class="pill">매운맛: ${spiceNames[meal.spice]}</span>
          </div>
        `;
        resultsEl.appendChild(card);
      });
      stampEl.textContent = nowKST();
    }

    function budgetText(val){
      if (val === "low") return "1만원 이하";
      if (val === "mid") return "1~2만원";
      return "2만원 이상";
    }

    function timeText(val){
      if (val === "quick") return "15분 내";
      if (val === "mid") return "30분 내";
      return "60분 이상";
    }

    function updateSpiceLabel(){
      spiceLabel.textContent = spiceNames[parseInt(spiceEl.value, 10)];
    }

    document.getElementById("pick").addEventListener("click", render);
    document.getElementById("shuffle").addEventListener("click", render);
    spiceEl.addEventListener("input", () => {
      updateSpiceLabel();
    });

    document.querySelectorAll(".quick").forEach(btn => {
      btn.addEventListener("click", () => {
        const preset = btn.dataset.preset;
        if (preset === "work"){
          moodEl.value = "comfort";
          styleEl.value = "any";
          budgetEl.value = "mid";
          timeEl.value = "quick";
          spiceEl.value = 2;
        }
        if (preset === "date"){
          moodEl.value = "fresh";
          styleEl.value = "western";
          budgetEl.value = "high";
          timeEl.value = "mid";
          spiceEl.value = 1;
        }
        if (preset === "rain"){
          moodEl.value = "comfort";
          styleEl.value = "korean";
          budgetEl.value = "low";
          timeEl.value = "mid";
          spiceEl.value = 2;
        }
        if (preset === "diet"){
          moodEl.value = "diet";
          styleEl.value = "any";
          budgetEl.value = "mid";
          timeEl.value = "quick";
          spiceEl.value = 0;
        }
        updateSpiceLabel();
        render();
      });
    });

    updateSpiceLabel();
    render();
  </script>
</body>
</html>
