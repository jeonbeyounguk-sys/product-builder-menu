<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>제휴 문의</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Nanum+Gothic:wght@400;700&display=swap");

    :root{
      --ink:#0b0b14;
      --muted:#5b6070;
      --card:#ffffff;
      --accent:#ff6b35;
      --accent-2:#00c2a8;
      --ring: rgba(255,107,53,.35);
      --shadow: 0 30px 70px rgba(11,11,20,.2);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"Nanum Gothic", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(900px 700px at 15% 15%, rgba(255,107,53,.28), transparent 60%),
        radial-gradient(800px 600px at 85% 25%, rgba(0,194,168,.25), transparent 60%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,210,117,.35), transparent 60%),
        linear-gradient(120deg, #f8f6f1 0%, #e7f6f3 45%, #fef3ec 100%);
      padding:32px;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      display:grid;
      gap:24px;
      grid-template-columns: 1.1fr .9fr;
      align-items: stretch;
    }

    @media (max-width: 900px){
      .wrap{ grid-template-columns: 1fr; }
    }

    .hero{
      padding:26px 28px;
      border-radius:24px;
      background: linear-gradient(135deg, #111827, #1f2937);
      color:#fff;
      position:relative;
      overflow:hidden;
      box-shadow: var(--shadow);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:-30% -10% auto auto;
      width:320px;
      height:320px;
      background: radial-gradient(circle at 30% 30%, rgba(255,107,53,.6), transparent 60%);
      transform: rotate(20deg);
    }

    .hero h1{
      margin:0 0 12px;
      font-family:"Space Grotesk", "Nanum Gothic", sans-serif;
      font-size:34px;
      letter-spacing:-.4px;
    }

    .hero p{
      margin:0 0 18px;
      color: rgba(255,255,255,.85);
      line-height:1.5;
    }

    .hero .tags{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .tag{
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.16);
      color:#fff;
      font-weight:700;
      font-size:13px;
      border:1px solid rgba(255,255,255,.18);
    }

    .card{
      background: var(--card);
      border-radius:24px;
      padding:26px 28px;
      box-shadow: var(--shadow);
    }

    .card h2{
      margin:0 0 6px;
      font-family:"Space Grotesk", "Nanum Gothic", sans-serif;
      font-size:24px;
      letter-spacing:-.3px;
    }

    .card p{
      margin:0 0 18px;
      color:var(--muted);
    }

    form{
      display:grid;
      gap:14px;
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      font-size:14px;
    }

    input, textarea{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid #e1e4ea;
      font-size:14px;
      font-family:"Nanum Gothic", sans-serif;
      background:#f9fafb;
      outline:none;
      transition: border .15s ease, box-shadow .15s ease, background .15s ease;
    }

    input:focus, textarea:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
      background:#fff;
    }

    textarea{ min-height:120px; resize:vertical; }

    .row{
      display:grid;
      gap:12px;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 640px){
      .row{ grid-template-columns: 1fr; }
    }

    .btn{
      border:0;
      border-radius:14px;
      padding:14px 16px;
      font-weight:800;
      color:#111827;
      cursor:pointer;
      background: linear-gradient(135deg, #ffd166, #ff7d51, #00c2a8);
      box-shadow: 0 14px 30px rgba(17,24,39,.18);
      transition: transform .12s ease, filter .12s ease;
    }

    .btn:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active{ transform: translateY(1px) scale(.99); }

    .note{
      font-size:12px;
      color:var(--muted);
      margin:0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>제휴 문의를 빠르게 연결합니다</h1>
      <p>브랜드 협업, 공동 프로모션, 제품 연동 제안을 남겨주시면 담당자가 1-2영업일 내 확인합니다.</p>
      <div class="tags">
        <span class="tag">브랜드 제휴</span>
        <span class="tag">콘텐츠 협업</span>
        <span class="tag">API 연동</span>
        <span class="tag">프로모션</span>
      </div>
    </section>

    <section class="card">
      <h2>제휴 문의 폼</h2>
      <p>필수 항목만 입력해 주세요. 제출하면 Formspree로 바로 전달됩니다.</p>

      <form action="https://formspree.io/f/xbdoqkdp" method="POST">
        <div class="row">
          <div>
            <label for="name">담당자 이름</label>
            <input id="name" name="name" type="text" placeholder="홍길동" required />
          </div>
          <div>
            <label for="company">회사명</label>
            <input id="company" name="company" type="text" placeholder="OOO" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="email@company.com" required />
          </div>
          <div>
            <label for="phone">연락처</label>
            <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" />
          </div>
        </div>

        <div>
          <label for="message">문의 내용</label>
          <textarea id="message" name="message" placeholder="제휴 목적, 일정, 기대 효과 등을 적어 주세요." required></textarea>
        </div>

        <button class="btn" type="submit">제휴 문의 제출</button>
        <p class="note">제출 시 개인정보 처리에 동의한 것으로 간주합니다.</p>
      </form>
    </section>
  </main>
</body>
</html>
