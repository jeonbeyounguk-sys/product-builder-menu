    :root{

      --card:#ffffff;
      --accent:#ff6a3d;
      --accent-2:#00b8a9;

    *{ box-sizing:border-box; }
    body{

    .wrap{
      max-width: 1140px;
      margin: 0 auto;
      display:grid;
      gap:18px;

    header{
      display:flex;

    .logo-badge{

      justify-content:center;
      font-weight:700;
      font-family:"Anton", sans-serif;
      font-size:22px;

      box-shadow: 0 16px 30px rgba(17,24,39,.25);
    }

    h1{
      margin:0;
      font-family:"Source Serif 4", serif;
      font-size:34px;
      letter-spacing:-.4px;
    }

    .sub{
      color:var(--muted);
      font-weight:700;
    }

    .layout{
      display:grid;
      gap:20px;
      grid-template-columns: 1.1fr .9fr;
      align-items:start;
    }

    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }

    .card{
      background: var(--card);
      border-radius:24px;
      padding:22px 24px;
      box-shadow: var(--shadow);
      border:1px solid var(--border);
      position:relative;
      overflow:hidden;
    }

    .hero{
      background: linear-gradient(135deg, #111827, #0f172a);
      color:#fff;
      border: none;
    }

    .hero h2{

      font-family:"Source Serif 4", serif;
      font-size:26px;
    }

    .hero p{ margin:0; color: rgba(255,255,255,.85); }

    .filters{
      margin-top:16px;
      display:grid;
      gap:12px;
    }

    .row{
      display:grid;
      gap:12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (max-width: 640px){
      .row{ grid-template-columns: 1fr; }
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      font-size:14px;
    }

    select, input[type="range"]{
      width:100%;
      border:0;
      outline:none;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight:700;
      background: rgba(255,255,255,.95);
      cursor:pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
    }

    .range-wrap{
      background: rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 12px;
      display:grid;
      gap:6px;
    }

    .range-meta{
      display:flex;
      justify-content:space-between;
      color: rgba(255,255,255,.8);
      font-size:12px;
      font-weight:700;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:10px;
    }

    .btn{

      cursor:pointer;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 900;
      color:#0b1020;
      background: linear-gradient(135deg, #ffd166, #ff8c5a, #00c2a8);

      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active{ transform: translateY(1px) scale(.99); }

    .btn-ghost{
      background: rgba(255,255,255,.9);
      color:#0b1020;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
    }

    .result-grid{
      display:grid;

      gap:14px;
      margin-top:12px;

    .meal-card{

      border:1px solid rgba(255,255,255,.6);
      box-shadow: 0 12px 26px rgba(0,0,0,.1);
      position:relative;
      overflow:hidden;
      animation: rise .4s ease both;
    }

    .meal-card::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(255,106,61,.18), rgba(0,184,169,.14), rgba(255,209,102,.18));
      opacity:.85;
      pointer-events:none;

    .meal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      position: relative;
      z-index: 1;
    }

    .meal-title{
      font-weight:900;
      letter-spacing:-.2px;
    }

    .tag{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      color:#111827;
      background: rgba(255,255,255,.9);
      font-weight:800;
      box-shadow: 0 8px 16px rgba(0,0,0,.08);
    }

    .meal-desc{
      margin:8px 0 12px;
      color: rgba(11, 16, 32, .75);
      font-size:13px;
      font-weight:600;
      position: relative;
      z-index: 1;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      position: relative;
      z-index: 1;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background: rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.6);
    }

    .side-card h3{
      margin:0 0 10px;
      font-family:"Source Serif 4", serif;
      font-size:22px;
      letter-spacing:-.3px;
    }

    .side-card p{
      margin:0 0 12px;
      color:var(--muted);
    }

    .suggestions{
      display:grid;
      gap:10px;
    }

    .quick{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid var(--border);
      cursor:pointer;
      font-weight:700;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .quick:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(17,24,39,.12);
    }

    .note{
      font-size:12px;
      color:var(--muted);
      margin:12px 0 0;
    }

    .meta{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,.7);
      font-weight: 700;

    .form-box{
      margin-top:16px;
      padding:16px;
      border-radius:18px;
      background:#fff7ee;
      border:1px solid rgba(255,106,61,.18);
      box-shadow: 0 10px 22px rgba(255,106,61,.12);
    }

    .form-box h4{
      margin:0 0 8px;
      font-size:16px;
      letter-spacing:-.2px;
    }

    .form-grid{
      display:grid;
      gap:10px;
    }

    .form-grid label{
      margin-bottom:4px;
      font-size:12px;
    }

    .form-grid input,
    .form-grid textarea{
      width:100%;
      border:1px solid rgba(15,15,20,.12);
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
      font-family:"Noto Sans KR", sans-serif;
      background:#ffffff;
      outline:none;
      transition: border .12s ease, box-shadow .12s ease;
    }

    .form-grid input:focus,
    .form-grid textarea:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,106,61,.25);
    }

    .form-grid textarea{
      min-height:110px;
      resize:vertical;
    }

    .submit{
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
      background: linear-gradient(135deg, #ffbe7b, #ff6a3d);
      color:#111827;
      box-shadow: 0 10px 20px rgba(255,106,61,.2);
      transition: transform .12s ease, filter .12s ease;
    }
    .submit:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .submit:active{ transform: translateY(1px) scale(.99); }

    @keyframes rise{
      from{ transform: translateY(8px); opacity:0; }
      to{ transform: translateY(0); opacity:1; }
    }
  </style>
</head>

  <script>
    const data = [
      { name:"??? ??", style:"korean", mood:["comfort","work"], time:"quick", budget:"mid", spice:1, desc:"??? ???? ?? ???? ????.", tags:["???","???","??"] },
      { name:"?????", style:"korean", mood:["late","work"], time:"quick", budget:"low", spice:2, desc:"??? ??? 10? ??, ?? ??? ???.", tags:["???","??","???"] },
      { name:"???", style:"korean", mood:["party","comfort"], time:"mid", budget:"mid", spice:3, desc:"??? ?? ???? ?? ?? ?? ??.", tags:["??","??","???"] },
      { name:"?????", style:"korean", mood:["comfort","rain"], time:"mid", budget:"low", spice:2, desc:"???? ???? ??? ??.", tags:["??","???","??"] },
      { name:"?? ??", style:"asian", mood:["comfort","rain"], time:"mid", budget:"mid", spice:1, desc:"??? ??? ??? ???? ? ??.", tags:["??","??","???"] },
      { name:"???", style:"asian", mood:["party","late"], time:"mid", budget:"high", spice:4, desc:"??? ??? ???? ???.", tags:["??","???","??"] },
      { name:"???", style:"asian", mood:["fresh","diet"], time:"mid", budget:"mid", spice:0, desc:"??? ??? ??? ??.", tags:["???","??","???"] },
      { name:"?? ??", style:"western", mood:["fresh","diet","date"], time:"quick", budget:"high", spice:0, desc:"??? ????, ??? ??.", tags:["???","???","???"] },
      { name:"???? ???", style:"western", mood:["date","fresh"], time:"mid", budget:"high", spice:0, desc:"??? ????? ???? ??? ?.", tags:["???","???","???"] },
      { name:"?? ???", style:"western", mood:["comfort","date"], time:"mid", budget:"mid", spice:0, desc:"???? ??? ???? ???.", tags:["????","??","???"] },
      { name:"??? ???", style:"western", mood:["fresh","work"], time:"mid", budget:"mid", spice:1, desc:"??? ??? ???? ?? ??.", tags:["???","??","???"] },
      { name:"?? & ??", style:"fast", mood:["party","late"], time:"quick", budget:"mid", spice:1, desc:"??? ???? ??? ??.", tags:["???","??","??"] },
      { name:"???? ???", style:"fast", mood:["fresh","work"], time:"quick", budget:"mid", spice:0, desc:"??? ???? ??? ???.", tags:["??","???","???"] },
      { name:"??", style:"asian", mood:["party","fresh"], time:"mid", budget:"mid", spice:2, desc:"??? ????? ?? ??.", tags:["???","??","???"] },
      { name:"????+??", style:"korean", mood:["comfort","party"], time:"long", budget:"high", spice:1, desc:"? ?? ?? ??? ?? ??.", tags:["??","??","??"] },
      { name:"????", style:"korean", mood:["fresh","late"], time:"quick", budget:"low", spice:3, desc:"???? ???? ???.", tags:["??","??","??"] }
    ];

    const moodEl = document.getElementById("mood");
    const styleEl = document.getElementById("style");
    const budgetEl = document.getElementById("budget");
    const timeEl = document.getElementById("time");
    const spiceEl = document.getElementById("spice");
    const spiceLabel = document.getElementById("spiceLabel");
    const resultsEl = document.getElementById("results");
    const stampEl = document.getElementById("timeStamp");

    const spiceNames = ["??", "??", "??", "??", "??"];

    function nowKST(){
      return new Intl.DateTimeFormat("ko-KR",{
        timeZone:"Asia/Seoul",
        dateStyle:"medium",
        timeStyle:"short"
      }).format(new Date());
    }

    function pickMeal(){
      const mood = moodEl.value;
      const style = styleEl.value;
      const budget = budgetEl.value;
      const time = timeEl.value;
      const spice = parseInt(spiceEl.value, 10);

      let list = data.filter(item => item.mood.includes(mood) || item.mood.includes("work") && mood === "comfort");
      if (style !== "any") list = list.filter(item => item.style === style);
      list = list.filter(item => item.budget === budget || budget === "mid");
      list = list.filter(item => item.time === time || time === "mid");
      list = list.filter(item => Math.abs(item.spice - spice) <= 1);

      if (list.length < 4){
        list = data.filter(item => Math.abs(item.spice - spice) <= 2);
      }

      return shuffle(list).slice(0, 4);
    }

    function shuffle(arr){
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function render(){
      const meals = pickMeal();
      resultsEl.innerHTML = "";
      meals.forEach((meal, idx) => {
        const card = document.createElement("div");
        card.className = "meal-card";
        card.style.animationDelay = `${idx * 0.05}s`;
        card.innerHTML = `
          <div class="meal-head">
            <div class="meal-title">${meal.name}</div>
            <span class="tag">??</span>
          </div>
          <div class="meal-desc">${meal.desc}</div>
          <div class="pill-row">
            <span class="pill">??: ${budgetText(meal.budget)}</span>
            <span class="pill">??: ${timeText(meal.time)}</span>
            <span class="pill">???: ${spiceNames[meal.spice]}</span>
          </div>
        `;
        resultsEl.appendChild(card);
      });
      stampEl.textContent = nowKST();
    }

    function budgetText(val){
      if (val === "low") return "1?? ??";
      if (val === "mid") return "1~2??";
      return "2?? ??";
    }

    function timeText(val){
      if (val === "quick") return "15? ?";
      if (val === "mid") return "30? ?";
      return "60? ??";
    }

    function updateSpiceLabel(){
      spiceLabel.textContent = spiceNames[parseInt(spiceEl.value, 10)];
    }

    document.getElementById("pick").addEventListener("click", render);
    document.getElementById("shuffle").addEventListener("click", render);
    spiceEl.addEventListener("input", () => {
      updateSpiceLabel();
    });

    document.querySelectorAll(".quick").forEach(btn => {
      btn.addEventListener("click", () => {
        const preset = btn.dataset.preset;
        if (preset === "work"){
          moodEl.value = "comfort";
          styleEl.value = "any";
          budgetEl.value = "mid";
          timeEl.value = "quick";
          spiceEl.value = 2;
        }
        if (preset === "date"){
          moodEl.value = "fresh";
          styleEl.value = "western";
          budgetEl.value = "high";
          timeEl.value = "mid";
          spiceEl.value = 1;
        }
        if (preset === "rain"){
          moodEl.value = "comfort";
          styleEl.value = "korean";
          budgetEl.value = "low";
          timeEl.value = "mid";
          spiceEl.value = 2;
        }
        if (preset === "diet"){
          moodEl.value = "diet";
          styleEl.value = "any";
          budgetEl.value = "mid";
          timeEl.value = "quick";
          spiceEl.value = 0;
        }
        updateSpiceLabel();
        render();
      });
    });

    updateSpiceLabel();
    render();
  </script>
